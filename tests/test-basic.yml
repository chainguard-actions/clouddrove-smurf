name: Test basic usage - install latest smurf
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure sudo is available
        run: |
          if ! command -v sudo &>/dev/null; then
            apt-get install -y sudo 2>/dev/null || true
          fi

      - name: Install smurf (latest)
        id: action
        uses: .
        with:
          version: latest

      - name: Assert smurf is installed and on PATH
        run: |
          echo "Checking smurf binary..."
          if ! command -v smurf &>/dev/null; then
            echo "FAIL: smurf binary not found on PATH"
            exit 1
          fi
          echo "PASS: smurf found at $(command -v smurf)"

      - name: Assert smurf --version returns output
        run: |
          VERSION_OUTPUT=$(smurf --version 2>&1 || true)
          echo "smurf --version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: smurf --version produced no output"
            exit 1
          fi
          echo "PASS"
