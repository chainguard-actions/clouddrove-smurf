name: Build

permissions:
  contents: read

env:
  GO_VERSION: 1.26.0
  APP_PACKAGE: github.com/clouddrove/smurf/cmd 

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{env.GO_VERSION}}

      - name: Go Mod Tidy
        run: go mod tidy

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Get Build Info
        id: buildinfo
        run: |
          set -euo pipefail
          echo "Collecting build information..."
          
          # Get version from GitHub releases or git tags
          VERSION=$(curl -sf https://api.github.com/repos/clouddrove/smurf/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || git describe --tags --abbrev=0)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          
          echo "Version: $VERSION"
          echo "Commit: $COMMIT"
          echo "Build Date: $DATE"
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      - name: Build
        env:
          APP_PKG: ${{ env.APP_PACKAGE }}
          BUILD_VERSION: ${{ steps.buildinfo.outputs.version }}
          BUILD_COMMIT: ${{ steps.buildinfo.outputs.commit }}
          BUILD_DATE: ${{ steps.buildinfo.outputs.date }}
        run: |
          echo "Building with version injection:"
          echo "Package: $APP_PKG"
          echo "Version: $BUILD_VERSION"
          echo "Commit: $BUILD_COMMIT"
          echo "Date: $BUILD_DATE"
          
          go build -a \
            -ldflags "\
              -X '${APP_PKG}.version=${BUILD_VERSION}' \
              -X '${APP_PKG}.commit=${BUILD_COMMIT}' \
              -X '${APP_PKG}.date=${BUILD_DATE}'" \
            -o smurf .

      - name: Verify Version
        run: |
          echo "Binary version report:"
          ./smurf --version
          ./smurf version

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{env.GO_VERSION}}
      - run: go fmt ./...
