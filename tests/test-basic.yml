name: Test basic usage (latest version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install smurf (latest)
        id: action
        uses: .

      - name: Assert smurf is installed and on PATH
        run: |
          echo "Checking smurf binary..."
          if ! command -v smurf > /dev/null 2>&1; then
            echo "FAIL: smurf binary not found on PATH"
            exit 1
          fi
          echo "PASS: smurf found at $(command -v smurf)"

      - name: Assert smurf --version returns a version string
        run: |
          VERSION_OUTPUT=$(smurf --version 2>&1)
          echo "smurf --version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: smurf --version returned empty output"
            exit 1
          fi
          echo "PASS: smurf --version returned: $VERSION_OUTPUT"
