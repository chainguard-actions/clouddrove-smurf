name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install smurf at specific version v1.0.0
        id: action
        uses: .
        with:
          version: v1.0.0

      - name: Assert smurf is installed
        run: |
          echo "Checking smurf binary exists..."
          if ! command -v smurf > /dev/null 2>&1; then
            echo "FAIL: smurf binary not found in PATH"
            exit 1
          fi
          echo "PASS: smurf binary found"

      - name: Assert smurf --version output contains version string
        run: |
          VERSION_OUTPUT=$(smurf --version 2>&1 || true)
          echo "smurf --version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: smurf --version produced no output"
            exit 1
          fi
          echo "PASS: smurf --version returned: $VERSION_OUTPUT"
