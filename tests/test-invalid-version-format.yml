name: Test invalid version format with letters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Attempt to install smurf with non-semver version
        id: action
        uses: .
        with:
          version: "vbad-version"
        continue-on-error: true

      - name: Assert action failed due to invalid version format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected invalid version format 'vbad-version'"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected version 'vbad-version'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
