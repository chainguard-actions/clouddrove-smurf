name: Smurf Action
description: Automate Docker, Terraform, and Helm with Smurf GitHub Actions
branding:
  color: black
  icon: anchor

inputs:
  path:
    description: Path to the Terraform configuration
    required: false
    default: .
  tool:
    description: 'Tool to use (e.g., stf)'
    required: true
  command:
    description: "Command to run (e.g., init)"
    required: true

runs:
  using: "docker"
  image: 'docker://ghcr.io/clouddrove/smurf@sha256:7660899466744f99eeffad4a144101474fdf4dbd58ddca09966aa5a0f6a547bc' # v0.0.5
  args:
    - ${{ inputs.tool }}
    - ${{ inputs.command }}