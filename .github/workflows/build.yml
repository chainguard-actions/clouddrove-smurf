name: Build

env:
  GO_VERSION: 1.26.0
  APP_PACKAGE: github.com/clouddrove/smurf/cmd 

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{env.GO_VERSION}}

      - name: Go Mod Tidy
        run: go mod tidy

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Get Build Info
        id: buildinfo
        run: |
          set -euo pipefail
          echo "Collecting build information..."
          
          # Get version from GitHub releases or git tags
          VERSION=$(curl -sf https://api.github.com/repos/clouddrove/smurf/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || git describe --tags --abbrev=0)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          
          echo "Version: $VERSION"
          echo "Commit: $COMMIT"
          echo "Build Date: $DATE"
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      - name: Build
        env:
          BUILD_APP_PACKAGE: ${{env.APP_PACKAGE}}
          BUILD_VERSION: ${{steps.buildinfo.outputs.version}}
          BUILD_COMMIT: ${{steps.buildinfo.outputs.commit}}
          BUILD_DATE: ${{steps.buildinfo.outputs.date}}
        run: |
          echo "Building with version injection:"
          echo "Package: $BUILD_APP_PACKAGE"
          echo "Version: $BUILD_VERSION"
          echo "Commit: $BUILD_COMMIT"
          echo "Date: $BUILD_DATE"
          
          go build -a \
            -ldflags "\
              -X '${BUILD_APP_PACKAGE}.version=${BUILD_VERSION}' \
              -X '${BUILD_APP_PACKAGE}.commit=${BUILD_COMMIT}' \
              -X '${BUILD_APP_PACKAGE}.date=${BUILD_DATE}'" \
            -o smurf .

      - name: Verify Version
        run: |
          echo "Binary version report:"
          ./smurf --version
          ./smurf version

      - name: Check CLI docs are up to date
        run: |
          make docs
          if [ -n "$(git status --porcelain docs/sm/docs/cli)" ]; then
            echo "Generated CLI docs in docs/sm/docs/cli are out of date."
            echo "Run 'make docs' locally and commit the result."
            git status --porcelain docs/sm/docs/cli
            git diff -- docs/sm/docs/cli
            exit 1
          fi

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{env.GO_VERSION}}
      - name: Check gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi
