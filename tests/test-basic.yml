name: Test basic usage - install latest smurf
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl and GitHub API mock
        run: |
          # Create a fake smurf binary using printf (avoids heredoc << in YAML)
          mkdir -p /tmp/fake-smurf-pkg
          printf '#!/bin/sh\necho "smurf version v0.0.99 (fake)"\n' > /tmp/fake-smurf-pkg/smurf
          chmod +x /tmp/fake-smurf-pkg/smurf

          # Create a tarball that the action will extract
          cd /tmp/fake-smurf-pkg
          tar -czf /tmp/fake-smurf.tar.gz smurf

          # Create fake curl script using printf to avoid heredoc issues
          mkdir -p /tmp/fake-bin
          printf '%s\n' \
            '#!/bin/sh' \
            '# Parse args to find output file (-o/--output or combined flags like -sSLo)' \
            'out=""' \
            'prev=""' \
            'for arg in "$@"; do' \
            '  case "$prev" in' \
            '    -o|--output) out="$arg" ;;' \
            '  esac' \
            '  prev="$arg"' \
            'done' \
            '# Second pass: handle combined flags like -sSLo' \
            'prev=""' \
            'for arg in "$@"; do' \
            '  if [ -n "$prev" ]; then' \
            '    case "$prev" in' \
            '      -*o)' \
            '        case "$prev" in' \
            '          --output) : ;;' \
            '          *) out="$arg" ;;' \
            '        esac' \
            '        ;;' \
            '    esac' \
            '  fi' \
            '  prev="$arg"' \
            'done' \
            '# GitHub API call for latest release' \
            'for arg in "$@"; do' \
            '  case "$arg" in' \
            '    *api.github.com*releases/latest*)' \
            '      echo "{\"tag_name\":\"v0.0.99\",\"name\":\"v0.0.99\"}"' \
            '      exit 0' \
            '      ;;' \
            '  esac' \
            'done' \
            '# Tarball download for smurf' \
            'for arg in "$@"; do' \
            '  case "$arg" in' \
            '    *clouddrove/smurf/releases/download*tar.gz*)' \
            '      if [ -n "$out" ]; then' \
            '        cat /tmp/fake-smurf.tar.gz > "$out"' \
            '      else' \
            '        cat /tmp/fake-smurf.tar.gz' \
            '      fi' \
            '      exit 0' \
            '      ;;' \
            '  esac' \
            'done' \
            '# Fall through to real curl' \
            'exec /usr/bin/curl "$@"' \
            > /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - name: Install smurf (latest)
        id: action
        uses: .
        with:
          version: latest

      - name: Assert smurf is installed and on PATH
        run: |
          echo "Checking smurf binary..."
          if ! command -v smurf > /dev/null 2>&1; then
            echo "FAIL: smurf binary not found on PATH"
            exit 1
          fi
          echo "PASS: smurf found at $(command -v smurf)"

      - name: Assert smurf --version returns output
        run: |
          VERSION_OUTPUT=$(smurf --version 2>&1 || true)
          echo "actual: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: smurf --version produced no output"
            exit 1
          fi
          echo "PASS: smurf --version returned: $VERSION_OUTPUT"
