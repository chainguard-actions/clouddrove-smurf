name: Release
on:
  push:
    tags: [ v* ]
env:
  GO_VERSION: 1.27.1
  REPO: ${{ github.repository }}
  APP_PACKAGE: github.com/clouddrove/smurf/cmd
  BINARY_NAME: smurf

# Restrictive default; the jobs that need to write override it below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        GOOS: [linux, darwin, windows]
        GOARCH: [amd64, arm64]
        include:
          - GOOS: windows
            ext: .exe
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Get Version from Tag
      id: version
      run: |
        raw="${GITHUB_REF#refs/tags/}"
        safe=$(printf '%s' "$raw" | tr -d '\n\r')
        echo "version=${safe}" >> "$GITHUB_OUTPUT"
        echo "Building version: ${safe}"

    - name: Get Build Info
      id: buildinfo
      env:
        INPUT_VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        echo "Collecting build information..."
        
        VERSION="$INPUT_VERSION"
        COMMIT=$(git rev-parse --short HEAD)
        DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        
        echo "Version: $VERSION"
        echo "Commit: $COMMIT"
        echo "Build Date: $DATE"
        
        safe_version=$(printf '%s' "$VERSION" | tr -d '\n\r')
        safe_commit=$(printf '%s' "$COMMIT" | tr -d '\n\r')
        safe_date=$(printf '%s' "$DATE" | tr -d '\n\r')
        echo "version=${safe_version}" >> "$GITHUB_OUTPUT"
        echo "commit=${safe_commit}" >> "$GITHUB_OUTPUT"
        echo "date=${safe_date}" >> "$GITHUB_OUTPUT"

    - name: Build Binary with Version Injection
      env:
        MATRIX_GOOS: ${{ matrix.GOOS }}
        MATRIX_GOARCH: ${{ matrix.GOARCH }}
        BUILD_BINARY_NAME: ${{ env.BINARY_NAME }}
        BUILD_APP_PACKAGE: ${{env.APP_PACKAGE}}
        BUILD_VERSION: ${{steps.buildinfo.outputs.version}}
        BUILD_COMMIT: ${{steps.buildinfo.outputs.commit}}
        BUILD_DATE: ${{steps.buildinfo.outputs.date}}
      run: |
        echo "Building $BUILD_BINARY_NAME for $MATRIX_GOOS/$MATRIX_GOARCH"
        echo "Package: $BUILD_APP_PACKAGE"
        echo "Version: $BUILD_VERSION"
        
        OUTPUT_NAME="$BUILD_BINARY_NAME"
        if [ "$MATRIX_GOOS" = "windows" ]; then
          OUTPUT_NAME="$OUTPUT_NAME.exe"
        fi
        
        # Create output directory
        mkdir -p "bin/$MATRIX_GOOS-$MATRIX_GOARCH"
        
        # CORRECTED BUILD COMMAND - using current directory (.)
        GOOS=$MATRIX_GOOS GOARCH=$MATRIX_GOARCH go build -a \
          -ldflags "\
            -X '${BUILD_APP_PACKAGE}.version=${BUILD_VERSION}' \
            -X '${BUILD_APP_PACKAGE}.commit=${BUILD_COMMIT}' \
            -X '${BUILD_APP_PACKAGE}.date=${BUILD_DATE}'" \
          -o "bin/$MATRIX_GOOS-$MATRIX_GOARCH/$OUTPUT_NAME" .

    - name: Create Distribution Archive
      env:
        MATRIX_GOOS: ${{ matrix.GOOS }}
        MATRIX_GOARCH: ${{ matrix.GOARCH }}
        DIST_BINARY_NAME: ${{ env.BINARY_NAME }}
        DIST_VERSION: ${{ steps.buildinfo.outputs.version }}
      run: |
        mkdir -p dist
        
        ARCHIVE_NAME="${DIST_BINARY_NAME}-${DIST_VERSION}-${MATRIX_GOOS}-${MATRIX_GOARCH}"
        
        if [ "$MATRIX_GOOS" = "windows" ]; then
          # For Windows: create zip with .exe binary
          zip -j "dist/$ARCHIVE_NAME.zip" "bin/$MATRIX_GOOS-$MATRIX_GOARCH/$DIST_BINARY_NAME.exe"
          echo "Created Windows archive: dist/$ARCHIVE_NAME.zip"
        else
          # For Linux/macOS: create tar.gz
          tar -czf "dist/$ARCHIVE_NAME.tar.gz" -C "bin/$MATRIX_GOOS-$MATRIX_GOARCH" "$DIST_BINARY_NAME"
          echo "Created Unix archive: dist/$ARCHIVE_NAME.tar.gz"
        fi
        
        echo "Distribution archives:"
        ls -la dist/

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: artifacts-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
        path: dist
        retention-days: 1
        if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Download All Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: artifacts
        pattern: artifacts-*
        merge-multiple: true

    - name: Install ChangeLog generator
      # curl rather than wget: the release URL redirects to
      # objects.githubusercontent.com, so redirects have to be followed, and
      # --proto-redir '=https' constrains every hop to HTTPS instead. --proto
      # '=https' rejects a non-HTTPS URL outright. Matches action.yml.
      #
      # The checksum is pinned here rather than fetched from the release's own
      # checksums.txt: a value committed to this repo is reviewed in git, while
      # a checksum file pulled from the same release could be replaced by
      # whoever replaced the tarball. Update both together when bumping.
      env:
        CHGLOG_VERSION: 0.15.1
        CHGLOG_SHA256: 5247e4602bac520e92fca317322fe716968a27aab1d91706f316627e3a3ee8e6
      run: |
        curl -fsSLO --proto '=https' --proto-redir '=https' --tlsv1.2 \
          "https://github.com/git-chglog/git-chglog/releases/download/v${CHGLOG_VERSION}/git-chglog_${CHGLOG_VERSION}_linux_amd64.tar.gz"
        echo "${CHGLOG_SHA256}  git-chglog_${CHGLOG_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
        tar xzf "git-chglog_${CHGLOG_VERSION}_linux_amd64.tar.gz" git-chglog
        
    - name: "Get Last Release"
      id: last_release
      uses: InsonusK/get-latest-release@7a9ff16c8c6b7ead5d71c0f1cc61f2703170eade # v1.1.0
      with:
        myToken: ${{ github.token }}
        exclude_types: "draft|prerelease"

    - name: Generate Changelog
      id: generate-changelog
      run: PATH="${PATH}:." make CHANGELOG.md

    - name: Generate checksums
      run: |
        cd artifacts
        echo "Files available for checksum generation:"
        ls -la
        
        # Create checksums for all archive files
        for file in *.tar.gz *.zip; do
          if [ -f "$file" ]; then
            sha256sum "$file" >> checksums.txt
            echo "Added checksum for: $file"
          fi
        done
        
        echo "Generated checksums:"
        cat checksums.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        files: |
          artifacts/*.tar.gz
          artifacts/*.zip
          artifacts/checksums.txt
        body_path: ./CHANGELOG.md
        generate_release_notes: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify Release
      env:
        GH_REPOSITORY: ${{ github.repository }}
        GH_REF_NAME: ${{ github.ref_name }}
      run: |
        echo "✅ Release created successfully!"
        echo "📦 Binaries available in GitHub Releases:"
        echo "   https://github.com/$GH_REPOSITORY/releases/tag/$GH_REF_NAME"

  docker-build:
    runs-on: ubuntu-latest
    name: Build the docker image
    needs: build
    # Pushes images to ghcr.io using GITHUB_TOKEN.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux Binary for Docker
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: artifacts-linux-amd64
          path: downloaded-artifacts

      - name: Extract Binary for Docker
        run: |
          mkdir -p docker-bin
          cd downloaded-artifacts
          
          # Extract the binary from the archive
          for file in *.tar.gz; do
            if [ -f "$file" ]; then
              tar -xzf "$file" -C ../docker-bin/
              echo "Extracted binary from: $file"
              break
            fi
          done
          
          echo "Binary ready for Docker:"
          ls -la ../docker-bin/

      - name: Build Docker Image
        env:
          DOCKER_BINARY_NAME: ${{ env.BINARY_NAME }}
          DOCKER_REPO: ${{env.REPO}}
          DOCKER_REF_NAME: ${{ github.ref_name }}
        run: |
          # Use the extracted binary
          cp "docker-bin/$DOCKER_BINARY_NAME" /usr/local/bin/ || true
          chmod +x "/usr/local/bin/$DOCKER_BINARY_NAME"
          
          make image IMAGE="ghcr.io/$DOCKER_REPO:$DOCKER_REF_NAME"

      - name: Tag latest
        env:
          DOCKER_REPO: ${{env.REPO}}
          DOCKER_REF_NAME: ${{ github.ref_name }}
        run: docker tag "ghcr.io/$DOCKER_REPO:$DOCKER_REF_NAME" "ghcr.io/$DOCKER_REPO:latest"

      - name: Push Docker Image
        env:
          DOCKER_REPO: ${{env.REPO}}
          DOCKER_REF_NAME: ${{ github.ref_name }}
        run: docker push "ghcr.io/$DOCKER_REPO:$DOCKER_REF_NAME"

      - name: Push Latest Tag
        env:
          DOCKER_REPO: ${{env.REPO}}
        run: docker push "ghcr.io/$DOCKER_REPO:latest"
