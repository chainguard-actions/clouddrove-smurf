name: Test invalid version format is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Attempt to install smurf with invalid version
        id: action
        uses: .
        with:
          version: "1.2.3"
        continue-on-error: true

      - name: Assert action failed due to invalid version format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected invalid version format '1.2.3' (missing 'v' prefix)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected invalid version format '1.2.3'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
